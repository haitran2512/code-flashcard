        /* 1. KHU VỰC TRANG TRÍ (CSS)                */

        /* --- CÀI ĐẶT CHUNG --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }
        
        /* --- NỀN CỦA TOÀN BỘ TRANG GAME --- */
        body { 
            /* Đổi màu nền ở đây (Đang là dải màu từ xanh ngọc sang xanh dương) */
            background: linear-gradient(135deg, #1abc9c, #2980b9); 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; color: white;
        }
        
        /* --- PHẦN TIÊU ĐỀ (Nối Từ Ký Ức) --- */
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 36px; margin-bottom: 10px; text-shadow: 0 2px 5px rgba(0,0,0,0.2); font-weight: 800;}
        .header p { font-size: 16px; opacity: 0.9; }

        /* --- BẢNG CHỨA CÁC THẺ GAME --- */
        .game-board {
            display: grid;
            /* Sửa số 5 ở dưới thành số khác nếu muốn thay đổi số cột thẻ trên 1 hàng */
            grid-template-columns: repeat(5, 1fr);
            gap: 15px; /* Khoảng cách giữa các thẻ */
            max-width: 1000px; /* Độ rộng tối đa của bảng */
            width: 100%;
        }

        .game-card {
            background: white; /* Màu nền của thẻ */
            color: #2c3e50; /* Màu chữ trên thẻ (Xám đen) */

            font-weight: 700;
            padding: 20px 10px;
            border-radius: 10px; /* Độ bo góc của thẻ */
