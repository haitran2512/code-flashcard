<script id="vocab-data" type="application/json">
        {{ vocab_list | tojson | safe }}
    </script>

    <script>
        // Lấy dữ liệu từ thẻ ảo ở trên và dịch ra
        const rawData = document.getElementById('vocab-data').textContent;
        const vocabList = JSON.parse(rawData);
        
        let cardsData = [];
        
        vocabList.forEach(item => {
            cardsData.push({ text: item.word, id: item.id, type: 'word' });
            cardsData.push({ text: item.meaning, id: item.id, type: 'meaning' });
        });

        // Xáo trộn mảng chuẩn Fisher-Yates
        for (let i = cardsData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cardsData[i], cardsData[j]] = [cardsData[j], cardsData[i]];
        }

        const gameBoard = document.getElementById('gameBoard');
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false; 
        let pairsMatched = 0;
        const totalPairs = vocabList.length;

        cardsData.forEach(data => {
            const cardEl = document.createElement('div');
            cardEl.classList.add('game-card');
            cardEl.innerText = data.text;
            cardEl.dataset.id = data.id;
            cardEl.dataset.type = data.type; 
            
            cardEl.addEventListener('click', () => handleCardClick(cardEl));
            gameBoard.appendChild(cardEl);
        });

        function handleCardClick(card) {
            if (lockBoard || card === firstCard || card.classList.contains('matched')) return;

            if (firstCard && firstCard.dataset.type === card.dataset.type) {
                firstCard.classList.remove('selected');
                firstCard = card;
                firstCard.classList.add('selected');
                return;
            }

            card.classList.add('selected');

            if (!firstCard) {
                firstCard = card;
                return;
            }

            secondCard = card;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.id === secondCard.dataset.id;
            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.remove('selected');
            secondCard.classList.remove('selected');
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            
            pairsMatched++;
            resetBoard();

            if (pairsMatched === totalPairs) {
                setTimeout(() => {
                    const btn = document.getElementById('btnNext');
                    btn.style.display = 'inline-block';
                    btn.innerText = "📝 Làm bài Test ngay"; 
                    btn.href = "/quiz"; 
                    
                    gameBoard.style.display = 'none';
                    document.querySelector('.header h1').innerText = "🎉 Cậu đỉnh quá!";
                    document.querySelector('.header p').innerText = "Khởi động thế là đủ rồi. Vào test ngay 10 từ cậu vừa nối nào!";
                }, 500);
            }
        }

        function unflipCards() {
            lockBoard = true; 
            
            firstCard.classList.remove('selected');
            secondCard.classList.remove('selected');
            firstCard.classList.add('wrong');
            secondCard.classList.add('wrong');

            setTimeout(() => {
                firstCard.classList.remove('wrong');
                secondCard.classList.remove('wrong');
                resetBoard();
            }, 600);
        }

        function resetBoard() {
            [firstCard, secondCard, lockBoard] = [null, null, false];
        }
    </script>
