<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(120deg, #2980b9, #8e44ad); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .reset-container { background: #ffffff; width: 400px; padding: 40px; border-radius: 10px; box-shadow: 0 15px 25px rgba(0,0,0,0.2); }
        .reset-container h2 { text-align: center; margin-bottom: 25px; color: #333; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; color: #666; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 16px; transition: 0.3s; }
        .input-group input:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        .error-message { color: #e74c3c; font-size: 13px; margin-top: 5px; display: none; }
        .btn-submit { width: 100%; padding: 12px; background: #27ae60; border: none; border-radius: 5px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #219653; }
    </style>
</head>
<body>
    <div class="reset-container">
        <h2>Đặt Mật Khẩu Mới 🔒</h2>
        <form action="/reset_password" method="POST" id="resetForm">
            <div class="input-group">
                <label for="password">Mật khẩu mới</label>
                <input type="password" id="password" name="password" minlength="6" required>
            </div>
            <div class="input-group">
                <label for="confirm_password">Nhập lại mật khẩu mới</label>
                <input type="password" id="confirm_password" required>
                <div class="error-message" id="passwordError">Mật khẩu không khớp!</div>
            </div>
            <button type="submit" class="btn-submit">Lưu Mật Khẩu</button>
        </form>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            if (pass !== confirm) {
                e.preventDefault();
                document.getElementById('passwordError').style.display = 'block';
            }
        });
    </script>
</body>
</html>
