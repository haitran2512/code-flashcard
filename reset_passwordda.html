<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu</title>
    <style>
        /* ========================================= */
        /* 1. KHU VỰC TRANG TRÍ (CSS)                */
        /* ========================================= */

        /* --- CÀI ĐẶT CHUNG TOÀN TRANG --- */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', sans-serif; /* Thay đổi font chữ toàn bộ ở đây */
        }

        /* --- NỀN VÀ CĂN GIỮA MÀN HÌNH --- */
        body { 
            /* Sửa dải màu nền ở dòng dưới (Đang đổ từ xanh dương sang tím) */
            background: linear-gradient(120deg, #2980b9, #8e44ad); 
            height: 100vh; /* Phủ kín chiều cao màn hình */
            display: flex; 
            justify-content: center; /* Căn hộp ra giữa theo chiều ngang */
            align-items: center; # Căn hộp ra giữa theo chiều dọc
        }

        /* --- HỘP TRẮNG CHỨA CÁC Ô NHẬP --- */
        .reset-container { 
            background: #ffffff; /* Sửa màu nền của hộp đặt lại mật khẩu */
            width: 400px; /* Sửa độ rộng (to/nhỏ) của hộp */
            padding: 40px; /* Khoảng cách từ viền trắng vào đến chữ bên trong */
            border-radius: 10px; /* Bo tròn 4 góc của hộp */
            box-shadow: 0 15px 25px rgba(0,0,0,0.2); /* Đổ bóng tạo hiệu ứng nổi 3D */
        }

        /* --- TIÊU ĐỀ CHỮ TO "ĐẶT MẬT KHẨU MỚI" --- */
        .reset-container h2 { 
            text-align: center; /* Căn chữ ra chính giữa */
            margin-bottom: 25px; /* Khoảng cách đẩy các ô nhập phía dưới ra xa */
            color: #333; /* Màu chữ tiêu đề */
        }

        /* --- KHUNG BAO QUANH MỖI Ô NHẬP LIỆU --- */
        .input-group { 
            margin-bottom: 20px; /* Khoảng cách giữa các ô nhập với nhau */
            position: relative; 
        }

        /* Tên nhãn mô tả của ô nhập ("Mật khẩu mới", "Nhập lại mật khẩu mới") */
        .input-group label { 
            display: block; 
            margin-bottom: 8px; /* Khoảng cách từ chữ xuống ô gõ */
            color: #666; /* Màu chữ mô tả */
            font-size: 14px; 
        }

        /* Ô trắng để gõ mật khẩu vào */
        .input-group input { 
            width: 100%; /* Kéo dài ô gõ bằng chiều rộng hộp */
            padding: 12px; /* Không gian trống bên trong ô gõ */
            border: 1px solid #ccc; /* Đường viền xám mặc định */
            border-radius: 5px; /* Bo góc ô gõ */
            outline: none; 
            font-size: 16px; 
            transition: 0.3s; 
        }

        /* Hiệu ứng đổi màu viền khi click chuột vào trong ô gõ */
        .input-group input:focus { 
            border-color: #3498db; /* Viền đổi sang màu xanh sáng */
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); /* Phát sáng nhẹ quanh ô */
        }

        /* --- DÒNG CHỮ BÁO LỖI MÀU ĐỎ ("Mật khẩu không khớp!") --- */
        .error-message { 
            color: #e74c3c; /* Màu đỏ báo lỗi */
            font-size: 13px; 
            margin-top: 5px; /* Khoảng cách sát đít ô nhập */
            display: none; /* MẶC ĐỊNH ẨN ĐI - Chỉ hiện hình bằng JavaScript khi gõ sai */
        }

        /* --- NÚT BẤM TO ĐÙNG "LƯU MẬT KHẨU" --- */
        .btn-submit { 
            width: 100%; /* Nút kéo dài hết cỡ */
            padding: 12px; 
            background: #27ae60; /* Màu nền mặc định của nút (Đang là Xanh lá cây) */
            border: none; 
            border-radius: 5px; /* Bo góc nút bấm */
            color: white; /* Màu chữ viết trên nút */
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; /* Đổi chuột thành hình bàn tay khi trỏ vào */
            margin-top: 10px; 
            transition: 0.3s;
        }

        /* Hiệu ứng khi di chuột (hover) vào nút bấm */
        .btn-submit:hover { 
            background: #219653; /* Đổi sang màu xanh lá đậm hơn khi di chuột vào */
        }
    </style>
</head>
<body>

    <div class="reset-container">
        
        <h2>Đặt Mật Khẩu Mới 🔒</h2>
        
        <form action="/reset_password" method="POST" id="resetForm">
            
            <div class="input-group">
                <label for="password">Mật khẩu mới</label>
                <input type="password" id="password" name="password" minlength="6" required>
            </div>
            
            <div class="input-group">
                <label for="confirm_password">Nhập lại mật khẩu mới</label>
                <input type="password" id="confirm_password" required>
                
                <div class="error-message" id="passwordError">Mật khẩu không khớp!</div>
            </div>
            
            <button type="submit" class="btn-submit">Lưu Mật Khẩu</button>
            
        </form>
    </div>

    <script>
        // Lắng nghe hành động khi người dùng nhấn nút Lưu Mật Khẩu (Submit Form)
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            
            # 1. Hút dữ liệu chữ đang gõ trong 2 ô mật khẩu ra để so sánh
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            
            // 2. SO SÁNH: Nếu mật khẩu gõ lần 1 KHÁC lần 2
            if (pass !== confirm) {
                e.preventDefault(); // BẮT BUỘC: Chặn đứng form lại, không cho gửi dữ liệu lên Python Backend
                
                // Ép dòng chữ báo lỗi màu đỏ hiện hình
                document.getElementById('passwordError').style.display = 'block';
                // Đổi viền ô gõ thứ 2 thành màu đỏ rực để cảnh báo
                document.getElementById('confirm_password').style.borderColor = '#e74c3c';
            } else {
                // Nếu mật khẩu khớp hoàn toàn
                document.getElementById('passwordError').style.display = 'none'; // Giấu chữ lỗi đi
                document.getElementById('confirm_password').style.borderColor = '#ccc'; // Trả lại màu viền xám mặc định
                
                // Form tự động thông quan gửi dữ liệu thẳng về cho Flask lưu vào Database
            }
        });
    </script>
</body>
</html>
