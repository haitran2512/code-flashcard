<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra - Pro Flashcard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(120deg, #2980b9, #8e44ad); min-height: 100vh; padding: 40px 20px; }
        
        .quiz-container { background: #ffffff; max-width: 800px; margin: 0 auto; padding: 40px; border-radius: 12px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .quiz-header { text-align: center; margin-bottom: 30px; border-bottom: 2px dashed #ddd; padding-bottom: 20px;}
        .quiz-header h2 { color: #2c3e50; font-size: 28px; }
        .quiz-header p { color: #666; margin-top: 10px; }

        .question-block { background: #f8f9fa; padding: 25px; border-radius: 10px; margin-bottom: 25px; border-left: 5px solid #3498db; }
        .question-text { font-size: 20px; font-weight: bold; color: #2c3e50; margin-bottom: 20px; }
        .question-text span { color: #e74c3c; font-size: 24px; }

        .options label { display: block; margin-bottom: 12px; cursor: pointer; padding: 15px; border: 2px solid #e0e0e0; border-radius: 8px; transition: 0.3s; background: white; font-size: 16px; font-weight: 500; color: #444;}
        .options label:hover { background: #eaf2f8; border-color: #3498db; }
        .options input[type="radio"] { margin-right: 15px; transform: scale(1.3); accent-color: #3498db; }

        .btn-submit { width: 100%; padding: 18px; background: #27ae60; border: none; border-radius: 10px; color: white; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3); margin-top: 10px;}
        .btn-submit:hover { background: #219653; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="quiz-header">
            <h2>Kiểm Tra Trí Nhớ 🧠</h2>
            <p>Chọn nghĩa tiếng Việt chính xác nhất cho 10 từ vựng cậu vừa học nhé!</p>
        </div>

        <form action="/quiz" method="POST">
            
            {% for q in questions %}
            <div class="question-block">
                <div class="question-text">Câu {{ q.id }}: Nghĩa của từ <span>"{{ q.word }}"</span> là gì?</div>
                <div class="options">
                    {% for opt in q.options %}
                    <label>
                        <input type="radio" name="q_{{ q.id }}" value="{{ opt }}" required> 
                        {{ opt }}
                    </label>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}

            <button type="submit" class="btn-submit">Nộp Bài & Xem Điểm</button>
        </form>
    </div>

</body>
</html>
