<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Pro Flashcard</title>
    <style>
        /* ========================================= */
        /* 1. KHU VỰC TRANG TRÍ (CSS)                */
        /* ========================================= */

        /* --- CÀI ĐẶT CHUNG TOÀN TRANG --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Đổi font chữ toàn bộ ở đây */
        }

        /* --- HÌNH NỀN VÀ CĂN GIỮA MÀN HÌNH --- */
        body {
            /* Sửa link ảnh nền ở dòng dưới ('static/image/login.jpg') */
            background: url('static/image/login.jpg') center/cover no-repeat;
            height: 100vh; /* Chiều cao phủ kín màn hình */
            display: flex;
            justify-content: center; /* Đẩy hộp ra chính giữa theo chiều ngang */
            align-items: center; /* Đẩy hộp ra chính giữa theo chiều dọc */
        }

        /* --- HỘP TRẮNG CHỨA GIAO DIỆN QUÊN MẬT KHẨU --- */
        .forgot-container {
            background: #ffffff; /* Sửa màu nền của hộp ở đây */
            width: 400px; # Sửa độ rộng (to/nhỏ) của hộp
            padding: 40px; /* Khoảng cách từ viền hộp vào đến chữ bên trong */
            border-radius: 10px; /* Độ bo tròn 4 góc của hộp */
            box-shadow: 0 15px 25px rgba(0,0,0,0.2); /* Đổ bóng tạo hiệu ứng nổi 3D */
            position: relative; /* Làm mốc tọa độ cho nút "Quay lại" bám theo */
        }

        /* --- NÚT QUAY LẠI TRANG ĐĂNG NHẬP (Góc trên bên trái) --- */
        .btn-back {
            position: absolute;
            top: 20px; /* Cách mép trên hộp 20px */
            left: 20px; /* Cách mép trái hộp 20px */
            color: #666; /* Màu chữ nút quay lại mặc định (Xám) */
            text-decoration: none; /* Xóa dấu gạch chân mặc định của thẻ link */
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s; /* Hiệu ứng đổi màu mượt mà mất 0.3 giây */
        }

        /* Hiệu ứng khi di chuột (hover) vào nút Quay lại */
        .btn-back:hover {
            color: #2980b9; /* Đổi sang màu xanh dương khi rê chuột vào */
        }

        /* --- TIÊU ĐỀ CHỮ TO "QUÊN MẬT KHẨU?" --- */
        .forgot-container h2 {
            text-align: center; /* Căn chữ ra chính giữa */
            margin-bottom: 15px; /* Khoảng cách đẩy dòng mô tả ở dưới ra xa */
            color: #333; /* Màu chữ tiêu đề */
            margin-top: 10px; /* Khoảng cách né nút quay lại ở trên */
        }

        /* --- ĐOẠN VĂN MÔ TẢ NGẮN ("Đừng lo lắng! Hãy nhập...") --- */
        .forgot-container p {
            text-align: center; /* Căn giữa đoạn văn */
            color: #666; /* Màu chữ xám nhẹ */
            font-size: 14px; /* Cỡ chữ mô tả */
            margin-bottom: 25px; /* Khoảng cách từ đoạn văn xuống ô nhập email */
            line-height: 1.5; /* Khoảng cách giữa các dòng chữ */
        }

        /* --- KHUNG BAO QUANH Ô NHẬP EMAIL --- */
        .input-group {
            margin-bottom: 20px; /* Khoảng cách từ ô nhập xuống nút bấm */
        }

        /* Tên nhãn của ô nhập ("Địa chỉ Email") */
        .input-group label {
            display: block;
            margin-bottom: 8px; /* Khoảng cách từ chữ xuống ô gõ */
            color: #666;
            font-size: 14px;
        }

        /* Ô trắng để người dùng gõ Email vào */
        .input-group input {
            width: 100%; /* Kéo dài ô gõ bằng chiều rộng hộp */
            padding: 12px; /* Không gian trống bên trong ô để gõ không bị kích */
            border: 1px solid #ccc; /* Đường viền xám bao quanh ô gõ */
            border-radius: 5px; /* Bo góc ô gõ */
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        /* Hiệu ứng đổi màu viền khi click chuột vào ô gõ email */
        .input-group input:focus {
            border-color: #3498db; /* Viền đổi sang màu xanh sáng */
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); /* Phát sáng nhẹ quanh ô */
        }

        /* --- NÚT BẤM TO ĐÙNG "GỬI YÊU CẦU" --- */
        .btn-submit {
            width: 100%; /* Nút kéo dài hết cỡ */
            padding: 12px;
            background: #f39c12; /* Sửa màu nền mặc định của nút ở đây (Đang là Vàng cam) */
            border: none;
            border-radius: 5px; /* Bo góc nút bấm */
            color: white; /* Màu chữ trên nút */
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; /* Đổi chuột thành hình bàn tay khi trỏ vào nút */
            transition: 0.3s;
        }

        /* Hiệu ứng đổi màu khi rê chuột vào nút Gửi yêu cầu */
        .btn-submit:hover {
            background: #e67e22; /* Màu cam đậm hơn khi di chuột vào */
        }

        /* --- DÒNG CHỮ "CHƯA CÓ TÀI KHOẢN? ĐĂNG KÝ NGAY" Ở DƯỚI CÙNG --- */
        .login-link {
            text-align: center;
            margin-top: 20px; /* Khoảng cách cách đuôi nút bấm ở trên */
            font-size: 14px;
            color: #666;
        }

        /* Đường link "Đăng ký ngay" */
        .login-link a {
            color: #3498db; /* Màu xanh link đăng ký */
            text-decoration: none;
            font-weight: bold;
        }

        /* Gạch chân đường link khi di chuột vào */
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="forgot-container">
        
        <a href="/login" class="btn-back">← Đăng nhập</a>

        <h2>Quên Mật Khẩu?</h2>
        <p>Đừng lo lắng! Hãy nhập địa chỉ email bạn đã đăng ký, chúng tôi sẽ gửi hướng dẫn khôi phục mật khẩu.</p>
        
        <form action="/forgot_password" method="POST">
            
            <div class="input-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required>
            </div>

            <button type="submit" class="btn-submit">Gửi Yêu Cầu</button>

            <div class="login-link">
                Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
            </div>
        </form>
    </div>

</body>
</html>
